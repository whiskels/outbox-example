services:
  postgresql:
    image: postgres:${POSTGRES_VERSION}
    hostname: postgresql
    container_name: postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      ORDER_SERVICE_DB_USER: ${ORDER_SERVICE_DB_USER}
      ORDER_SERVICE_DB_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD}
      LOGISTICS_SERVICE_DB_USER: ${LOGISTICS_SERVICE_DB_USER}
      LOGISTICS_SERVICE_DB_PASSWORD: ${LOGISTICS_SERVICE_DB_PASSWORD}
      CONDUKTOR_DB_USER: ${CONDUKTOR_DB_USER}
      CONDUKTOR_DB_PASSWORD: ${CONDUKTOR_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    ports:
      - '${POSTGRESQL_PORT}:5432'
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - pg_data:/var/lib/postgresql/data

  broker:
    image: confluentinc/cp-kafka:${CONFLUENT_PLATFORM_VERSION}
    hostname: broker
    container_name: broker
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      retries: 10
    ports:
      - '${KAFKA_PORT}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: 'broker:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # Conduktor Console, the enterprise UI.
  # It depends on PostgreSQL. Here, we depend on Redpanda only for our get-started.
  # https://docs.conduktor.io/platform/get-started/configuration/introduction/
  conduktor-console:
    image: conduktor/conduktor-console:${CONDUKTOR_CONSOLE_VERSION}
    container_name: conduktor-console
    ports:
      - "${CONDUKTOR_PORT}:80"
    volumes:
      - conduktor_data:/var/conduktor
    environment:
      CDK_DATABASE_URL: postgresql://${CONDUKTOR_DB_USER}:${CONDUKTOR_DB_PASSWORD}@postgresql:5432/conduktor-console
      CDK_ORGANIZATION_NAME: demo
      CDK_LISTENING_PORT: 80
      CDK_ADMIN_EMAIL: ${CONDUKTOR_ADMIN_EMAIL}
      CDK_ADMIN_PASSWORD: ${CONDUKTOR_ADMIN_PASSWORD}
      CDK_CLUSTERS_0_ID: default
      CDK_CLUSTERS_0_NAME: My Local Kafka Cluster
      CDK_CLUSTERS_0_COLOR: #0013E7
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: PLAINTEXT://broker:29092
      CDK_MONITORING_CORTEX-URL: http://conduktor-monitoring:9009/
      CDK_MONITORING_ALERT-MANAGER-URL: http://conduktor-monitoring:9010/
      CDK_MONITORING_CALLBACK-URL: http://conduktor-console:80/monitoring/api/
      CDK_MONITORING_NOTIFICATIONS-CALLBACK-URL: http://localhost:80
    depends_on:
      broker:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  conduktor-monitoring:
    image: conduktor/conduktor-console-cortex:${CONDUKTOR_CONSOLE_VERSION}
    container_name: conduktor-monitoring
    environment:
      CDK_CONSOLE-URL: http://conduktor-console:80
    depends_on:
      conduktor-console:
        condition: service_started

  loki:
    image: grafana/loki:${LOKI_VERSION}
    container_name: loki
    healthcheck:
      test: wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q -w ready || exit 1
      interval: 5s
      timeout: 1s
      retries: 10
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./observability/loki/local-config.yaml:/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    environment:
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources/grafana-datasource.yml:/etc/grafana/provisioning/datasources/grafana-datasource.yml
      - ./observability/grafana/provisioning/dashboards/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/grafana-dashboard.yml
      - ./observability/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - loki


  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    restart: on-failure
    # https://prometheus.io/docs/prometheus/latest/storage/#remote-storage-integrations
    command:
      # See feature flags: https://prometheus.io/docs/prometheus/latest/feature_flags/
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
      - --config.file=/etc/prometheus/prometheus.yml
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"

  tempo:
    image: grafana/tempo:${TEMPO_VERSION}
    container_name: tempo
    command: [ "-config.file=/etc/tempo_config.yml" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3200/api/echo || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    ports:
      - "${TEMPO_PORT}:3200"      # tempo
      - "${TEMPO_HTTP_PORT}:4318" # otlp http
      - "${TEMPO_GRPC_PORT}:4317" # otlp grpc
    volumes:
      - ./observability/tempo/tempo_config.yml:/etc/tempo_config.yml:ro

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
      args:
        - SERVICE_PORT=${ORDER_SERVICE_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${ORDER_SERVICE_PORT}/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgresql:
        condition: service_healthy
      broker:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/postgres
      - SPRING_DATASOURCE_USERNAME=${ORDER_SERVICE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${ORDER_SERVICE_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=broker:29092
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:${TEMPO_HTTP_PORT}/v1/traces
      - LOKI_HOST=loki
      - LOKI_PORT=${LOKI_PORT}

  logistics-service:
    build:
      context: .
      dockerfile: logistics-service/Dockerfile
      args:
        - SERVICE_PORT=${LOGISTICS_SERVICE_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${LOGISTICS_SERVICE_PORT}/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgresql:
        condition: service_healthy
      broker:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    ports:
      - "${LOGISTICS_SERVICE_PORT}:${LOGISTICS_SERVICE_PORT}"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/postgres
      - SPRING_DATASOURCE_USERNAME=${LOGISTICS_SERVICE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${LOGISTICS_SERVICE_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=broker:29092
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:${TEMPO_HTTP_PORT}/v1/traces
      - LOKI_HOST=loki
      - LOKI_PORT=${LOKI_PORT}

  order-simulator:
    image: grafana/k6:${K6_VERSION}
    container_name: order-simulator
    depends_on:
      order-service:
        condition: service_healthy
    volumes:
      - ./load-tests:/scripts
    command: run /scripts/order-load-test.js
    environment:
      - TARGET_HOST=order-service:${ORDER_SERVICE_PORT}
      - VUS=${LOAD_TEST_VUS}
      - DURATION=${LOAD_TEST_DURATION}
      - SIMULATION_STRATEGY=  ${SIMULATION_STRATEGY}

volumes:
  pg_data: { }
  conduktor_data: { }
  prometheus_data: { }