global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.
scrape_configs:

  - job_name: 'producer'
    scrape_interval: 15s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8078' ]

  - job_name: 'consumer'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8079' ]

